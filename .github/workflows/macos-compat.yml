# Build the macOS release binaries once, then run them on macOS 15 and macOS 26.
# macos-13 and macos-14 are retired, so they are not in this matrix.
name: macOS compatibility

on:
  workflow_dispatch:
  pull_request:
    branches: [master]

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
            artifact: rindexer-darwin-arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            artifact: rindexer-darwin-amd64
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-compat-${{ matrix.target }}
          cache-on-failure: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build release binary
        working-directory: cli
        shell: bash
        run: |
          set -eo pipefail
          # 15.0 is the floor for both architectures. Do not copy the runner SDK
          # version: that made the Apple Silicon binary require macOS 26.5.
          export MACOSX_DEPLOYMENT_TARGET=15.0
          export SDKROOT="$(xcrun -sdk macosx --show-sdk-path)"
          export CFLAGS="-mmacosx-version-min=15.0"
          export CXXFLAGS="-mmacosx-version-min=15.0"
          export LDFLAGS="-mmacosx-version-min=15.0"
          echo "MACOSX_DEPLOYMENT_TARGET=$MACOSX_DEPLOYMENT_TARGET"
          echo "SDKROOT=$SDKROOT"
          cargo build --release --target "${{ matrix.target }}" --features jemalloc,reth

      - name: Check minos, link, and rindexer new
        shell: bash
        run: bash ci/check-macos-binary.sh "${{ github.workspace }}/target/${{ matrix.target }}/release/rindexer_cli" 15.0

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/rindexer_cli
          if-no-files-found: error

  smoke:
    name: Run on ${{ matrix.runner }}
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            artifact: rindexer-darwin-arm64
          - runner: macos-latest
            artifact: rindexer-darwin-arm64
          - runner: macos-15-intel
            artifact: rindexer-darwin-amd64
    steps:
      - uses: actions/checkout@v4

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist

      - name: Check minos, link, and rindexer new
        shell: bash
        run: bash ci/check-macos-binary.sh dist/rindexer_cli 15.0
