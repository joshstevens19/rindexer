name: Mac smoke builds

on:
  pull_request:
    branches: [master]

jobs:
  smoke:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Mac apple silicon smoke build
            runner: macos-latest
            target: aarch64-apple-darwin
          - name: Mac intel smoke build
            runner: macos-15-intel
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: mac-smoke-${{ matrix.target }}
          cache-on-failure: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build release binary
        working-directory: cli
        shell: bash
        run: |
          set -eo pipefail
          export MACOSX_DEPLOYMENT_TARGET=15.0
          export SDKROOT="$(xcrun -sdk macosx --show-sdk-path)"
          export CFLAGS="-mmacosx-version-min=15.0"
          export CXXFLAGS="-mmacosx-version-min=15.0"
          export LDFLAGS="-mmacosx-version-min=15.0"
          cargo build --release --target "${{ matrix.target }}" --features jemalloc,reth

      - name: Version
        shell: bash
        run: |
          "${{ github.workspace }}/target/${{ matrix.target }}/release/rindexer_cli" --version
