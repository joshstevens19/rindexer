name: Cargo deny

on:
  pull_request:
    branches: [master]
    paths:
      - Cargo.toml
      - Cargo.lock
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - deny.toml
      - .github/workflows/cargo-deny.yml

permissions:
  contents: read

jobs:
  cargo-deny:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@b66acf5e9fe20f8aba065be86778a8a4c846f902 # v2, cargo-deny 0.20.2
        with:
          rust-version: stable
          arguments: --workspace --locked --target x86_64-unknown-linux-gnu
          command: check
          command-arguments: bans
