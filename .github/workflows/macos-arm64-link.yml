# Manual re-check of the Apple Silicon release link.
# The pull_request trigger ran once on PR #501 (run 43657431869) and was removed.
name: macOS arm64 release link

on:
  workflow_dispatch:

jobs:
  aarch64-apple-darwin:
    name: Release link aarch64-apple-darwin
    runs-on: macos-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-link-aarch64-apple-darwin
          cache-on-failure: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apple M1 setup
        run: |
          echo "SDKROOT=$(xcrun -sdk macosx --show-sdk-path)" >> $GITHUB_ENV
          echo "MACOSX_DEPLOYMENT_TARGET=$(xcrun -sdk macosx --show-sdk-platform-version)" >> $GITHUB_ENV

      - name: Build release binary
        working-directory: cli
        shell: bash
        run: |
          set -eo pipefail
          RUST_BACKTRACE=1 cargo build --release --target aarch64-apple-darwin --features jemalloc,reth

      - name: Link check and otool -L
        shell: bash
        run: |
          set -eo pipefail
          binary_path="${{ github.workspace }}/target/aarch64-apple-darwin/release/rindexer_cli"
          "$binary_path" --version
          "$binary_path" help
          echo "=== otool -L $binary_path ==="
          otool -L "$binary_path"
          if otool -L "$binary_path" | grep -Ei 'libssl|libcrypto|openssl'; then
            echo "Release binary links OpenSSL dynamically (Homebrew or /usr/local)."
            exit 1
          fi
          echo "No dynamic OpenSSL dependency."
