# sync_together Tables Example
#
# Tracks USDC holder balances aggregated ACROSS chains (cross_chain table),
# with `sync_together: true` so that during live indexing each block's raw
# Transfer rows, the balance upserts, and the checkpoint commit in ONE
# Postgres transaction per block, per network. A reader can never observe a
# block partially applied (e.g. raw transfers visible but balances not yet
# updated), and checkpoints can never drift from the data.
#
# Transactions are per network: ethereum commits its own per-block tx,
# arbitrum its own — the cross-chain aggregate is the sum of each network's
# committed prefix.
#
# NOTE: sync_together applies to LIVE indexing (no end_block allowed).
# start_block is optional for grouped members: without one, a member starts at
# the chain tip on first boot and resumes from its checkpoint on restarts.
# This example sets explicit start_blocks to control the backfill range — if
# you keep them, set each to a block near the current tip so the backfill is
# short (USDC is high-volume, an old start_block means a long backfill before
# lockstep begins).
#
# Starting mid-stream means balances are NET FLOW since start_block (holders'
# pre-existing balances are unknown, so net senders show negative values).
# The invariant SUM(all balances) == credits - debits holds exactly.
#
# For cross-CONTRACT groups, use the top-level `sync_together:` key instead —
# see the docs: /docs/start-building/yaml-config/sync-together
name: SyncTogetherExample
description: Cross-chain USDC balances with per-block atomic (lockstep) live indexing
repository: https://github.com/joshstevens19/rindexer
project_type: no-code

networks:
  - name: ethereum
    chain_id: 1
    rpc: https://mainnet.gateway.tenderly.co
  - name: arbitrum
    chain_id: 42161
    rpc: https://arbitrum.gateway.tenderly.co
  - name: optimism
    chain_id: 10
    rpc: https://optimism.gateway.tenderly.co

storage:
  postgres:
    enabled: true
    drop_each_run: true

contracts:
  - name: USDC
    details:
      - network: ethereum
        address: "0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48"
        start_block: "25569080"
      - network: arbitrum
        address: "0xaf88d065e77c8cC2239327C5EDb3A432268e5831"
        start_block: "485604500"
      - network: optimism
        address: "0x0b2c639c533813f4aa9d7837caf62653d097ff85"
        start_block: "154446700"
    abi: ./abis/ERC20.abi.json
    include_events:
      - Transfer
    tables:
      - name: total_balances
        # One row per holder summed across ALL networks (no network column)
        cross_chain: true
        # Lockstep: this table's events commit per-block atomically with the
        # raw Transfer rows and the checkpoints, per network
        sync_together: true
        columns:
          - name: holder
          - name: balance
            default: "0"
        events:
          - event: Transfer
            operations:
              # Credit the recipient
              - type: upsert
                where:
                  holder: $to
                if: "$to != 0x0000000000000000000000000000000000000000"
                set:
                  - column: balance
                    action: add
                    value: $value
              # Debit the sender
              - type: upsert
                where:
                  holder: $from
                if: "$from != 0x0000000000000000000000000000000000000000"
                set:
                  - column: balance
                    action: subtract
                    value: $value
